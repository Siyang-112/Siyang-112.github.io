<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雪格传媒 — 项目经理 | SIYANG SUO</title>
    <link rel="stylesheet" href="project.css">
</head>
<body>
    <a href="../index.html#experience" class="hero-back">← 返回</a>

    <div class="hero hero-compact">
        <div class="hero-bg" id="heroBg" style="background: linear-gradient(160deg, #0a0a0b 0%, #0c0e0c 100%)"></div>
        <div class="hero-content">
            <div class="hero-meta">
                <span>雪格传媒</span>
                <span>北京</span>
                <span>2021.06 — 2021.09</span>
            </div>
            <h1>项目经理</h1>
            <p class="hero-desc">展厅设计与落地施工项目管理，统筹多方供应商交付。</p>
        </div>
    </div>

    <div class="content">
        <div class="section fade-up">
            <span class="section-label">项目</span>
            <a href="jd-exhibition.html" class="project-block">
                <h3>京东展厅设计与施工</h3>
                <p>负责京东展厅从概念设计到施工落地的全流程项目管理。协调设计团队、施工方、物料供应商等多方资源，在紧凑周期内保质交付。</p>
            </a>
            <ul class="approach-list">
                <li>统筹 3 家供应商的进场时间与施工顺序</li>
                <li>管控材料采购、质量验收与工期节点</li>
                <li>协调甲方需求变更与设计方案迭代</li>
                <li>按期交付，客户满意度高</li>
            </ul>
        </div>

        <div class="section fade-up">
            <span class="section-label">核心能力</span>
            <div class="deliverables">
                <div class="deliverable-item">项目时间线管理</div>
                <div class="deliverable-item">多方供应商协调</div>
                <div class="deliverable-item">设计施工一体化管控</div>
                <div class="deliverable-item">客户沟通与需求管理</div>
            </div>
        </div>
    </div>

    <footer class="page-footer">
        <a href="../index.html#experience">← 返回经历</a>
    </footer>

    <script>
        const heroBg = document.getElementById('heroBg');
        const hero = document.querySelector('.hero');
        window.addEventListener('scroll', () => { const s = window.scrollY; if (s <= hero.offsetHeight) heroBg.style.transform = `translateY(${s*0.4}px)`; }, { passive: true });
        const obs = new IntersectionObserver((entries) => { entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } }); }, { threshold: 0.15 });
        document.querySelectorAll('.fade-up').forEach(el => obs.observe(el));
    </script>
</body>
</html>
