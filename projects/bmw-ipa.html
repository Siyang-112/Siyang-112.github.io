<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW 智能个人助手 | SIYANG SUO</title>
    <link rel="stylesheet" href="project.css">
</head>
<body>
    <a href="../index.html" class="hero-back">← 返回</a>

    <div class="hero hero-compact">
        <div class="hero-bg" id="heroBg" style="background-color: #0a0a0a"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-meta">
                <span>CapsuleTech</span>
                <span>BMW Group</span>
                <span>4 人开发团队</span>
            </div>
            <h1>BMW 智能个人助手演示</h1>
            <p class="hero-desc">管理 BMW 智能个人助手演示项目的开发，协调开发团队与客户方利益相关者，按期交付交互式 AI 助手演示。</p>
        </div>
    </div>

    <div class="content">
        <div class="section">
            <span class="section-label">职责</span>
            <h2>项目协调与交付</h2>
            <ul class="approach-list">
                <li>全英文协调 4 名开发人员与 BMW 客户沟通</li>
                <li>把控项目时间线与交付物质量</li>
                <li>将客户需求转化为可执行的开发任务</li>
                <li>管理利益相关方期望与进度汇报</li>
            </ul>
        </div>

        <div class="section">
            <span class="section-label">交付物</span>
            <div class="deliverables">
                <div class="deliverable-item">IPA 交互演示</div>
                <div class="deliverable-item">客户需求规格文档</div>
                <div class="deliverable-item">项目进度报告</div>
                <div class="deliverable-item">最终演示方案</div>
            </div>
        </div>
    </div>

    <footer class="page-footer">
        <a href="../index.html">← 返回作品集</a>
    </footer>

    <script>
        const heroBg = document.getElementById('heroBg');
        const hero = document.querySelector('.hero');
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            if (scrollY <= hero.offsetHeight) {
                heroBg.style.transform = `translateY(${scrollY * 0.4}px)`;
            }
        }, { passive: true });
    </script>
</body>
</html>
